<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Chat Room</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@600;700;800&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:        #0d0f14;
      --surface:   #151820;
      --panel:     #1c2030;
      --border:    #2a2f42;
      --accent:    #5dffb6;
      --accent2:   #ff5d8f;
      --text:      #e8eaf2;
      --muted:     #6b7094;
      --me-bg:     #1a3029;
      --other-bg:  #1c2030;
      --radius:    14px;
    }

    html, body { height: 100%; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    /* noise overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }

    /* ── MODAL username ── */
    #modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,.75);
      backdrop-filter: blur(8px);
      display: flex; align-items: center; justify-content: center;
      z-index: 100;
      animation: fadeIn .3s ease;
    }

    #modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 20px;
      padding: 40px 36px;
      width: 100%; max-width: 380px;
      box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(93,255,182,.08);
      text-align: center;
    }

    #modal .logo {
      font-family: 'Syne', sans-serif;
      font-size: 2rem;
      font-weight: 800;
      letter-spacing: -1px;
      color: var(--accent);
      margin-bottom: 6px;
    }

    #modal p {
      color: var(--muted);
      font-size: .8rem;
      margin-bottom: 28px;
    }

    #modal input {
      width: 100%;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: .9rem;
      padding: 14px 18px;
      outline: none;
      transition: border-color .2s;
      margin-bottom: 16px;
    }

    #modal input:focus { border-color: var(--accent); }

    #modal button {
      width: 100%;
      background: var(--accent);
      border: none; border-radius: var(--radius);
      color: #0d0f14;
      font-family: 'Syne', sans-serif;
      font-size: 1rem; font-weight: 700;
      padding: 14px;
      cursor: pointer;
      transition: opacity .2s, transform .15s;
      letter-spacing: .5px;
    }

    #modal button:hover { opacity: .88; transform: translateY(-1px); }

    /* ── CHAT WRAPPER ── */
    #app {
      position: relative; z-index: 1;
      display: flex; flex-direction: column;
      width: 100%; max-width: 720px;
      height: 88vh; max-height: 820px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 22px;
      overflow: hidden;
      box-shadow: 0 40px 100px rgba(0,0,0,.5), 0 0 0 1px rgba(93,255,182,.06);
    }

    /* ── HEADER ── */
    header {
      display: flex; align-items: center; gap: 14px;
      padding: 18px 24px;
      border-bottom: 1px solid var(--border);
      background: var(--panel);
    }

    header .dot {
      width: 10px; height: 10px;
      background: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent);
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%,100% { opacity:1; transform:scale(1); }
      50%      { opacity:.5; transform:scale(.85); }
    }

    header h1 {
      font-family: 'Syne', sans-serif;
      font-size: 1.15rem; font-weight: 700;
      letter-spacing: -.3px;
      flex: 1;
    }

    #user-count {
      font-size: .75rem;
      color: var(--muted);
      background: var(--border);
      padding: 4px 10px;
      border-radius: 99px;
    }

    #user-count span { color: var(--accent); font-weight: 500; }

    /* ── MESSAGES ── */
    #messages-wrap {
      flex: 1;
      overflow-y: auto;
      padding: 24px 20px;
      display: flex; flex-direction: column; gap: 14px;
      scroll-behavior: smooth;
    }

    #messages-wrap::-webkit-scrollbar { width: 4px; }
    #messages-wrap::-webkit-scrollbar-track { background: transparent; }
    #messages-wrap::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

    .msg {
      display: flex;
      flex-direction: column;
      max-width: 72%;
      animation: slideUp .25s ease;
    }

    @keyframes slideUp {
      from { opacity:0; transform:translateY(10px); }
      to   { opacity:1; transform:translateY(0); }
    }

    .msg.me   { align-self: flex-end; align-items: flex-end; }
    .msg.other{ align-self: flex-start; align-items: flex-start; }

    .msg .author {
      font-size: .68rem;
      color: var(--muted);
      margin-bottom: 5px;
      padding: 0 4px;
      display: flex; align-items: center; gap: 6px;
    }

    .msg.me .author { color: var(--accent); }

    .msg .bubble {
      padding: 11px 16px;
      border-radius: 16px;
      font-size: .85rem;
      line-height: 1.55;
      word-break: break-word;
    }

    .msg.me .bubble {
      background: var(--me-bg);
      border: 1px solid rgba(93,255,182,.2);
      border-bottom-right-radius: 4px;
      color: #b6ffe1;
    }

    .msg.other .bubble {
      background: var(--other-bg);
      border: 1px solid var(--border);
      border-bottom-left-radius: 4px;
    }

    .msg .time {
      font-size: .62rem;
      color: var(--muted);
      margin-top: 4px;
      padding: 0 4px;
    }

    /* system messages */
    .msg.system {
      align-self: center;
      max-width: 90%;
    }

    .msg.system .bubble {
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 99px;
      color: var(--muted);
      font-size: .72rem;
      padding: 5px 16px;
      text-align: center;
    }

    /* ── INPUT AREA ── */
    #input-area {
      border-top: 1px solid var(--border);
      padding: 16px 20px;
      display: flex; gap: 12px;
      background: var(--panel);
    }

    #messageInput {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'DM Mono', monospace;
      font-size: .88rem;
      padding: 13px 18px;
      outline: none;
      transition: border-color .2s;
    }

    #messageInput::placeholder { color: var(--muted); }
    #messageInput:focus { border-color: var(--accent); }

    #sendBtn {
      background: var(--accent);
      border: none; border-radius: var(--radius);
      color: #0d0f14;
      font-family: 'Syne', sans-serif;
      font-weight: 700; font-size: .9rem;
      padding: 13px 22px;
      cursor: pointer;
      transition: opacity .2s, transform .15s;
      white-space: nowrap;
    }

    #sendBtn:hover { opacity: .88; transform: translateY(-1px); }
    #sendBtn:active { transform: translateY(0); }

    @keyframes fadeIn {
      from { opacity:0; } to { opacity:1; }
    }
  </style>
</head>
<body>

  <!-- USERNAME MODAL -->
  <div id="modal-overlay">
    <div id="modal">
      <div class="logo">◈ chatroom</div>
      <p>entra con il tuo username</p>
      <input id="usernameInput" maxlength="20" placeholder="es. marco_98" autocomplete="off"/>
      <button onclick="joinChat()">Entra nella stanza →</button>
    </div>
  </div>

  <!-- CHAT APP -->
  <div id="app">
    <header>
      <div class="dot"></div>
      <h1>◈ chatroom</h1>
      <div id="user-count">online: <span id="count">0</span></div>
    </header>

    <div id="messages-wrap"></div>

    <div id="input-area">
      <input id="messageInput" autocomplete="off" placeholder="scrivi un messaggio…" disabled/>
      <button id="sendBtn" onclick="sendMessage()" disabled>invia</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let myUsername = '';

    // ── JOIN ──
    function joinChat() {
      const val = document.getElementById('usernameInput').value.trim();
      if (!val) return;
      myUsername = val;

      socket.emit('setUsername', myUsername);

      document.getElementById('modal-overlay').style.display = 'none';
      document.getElementById('messageInput').disabled = false;
      document.getElementById('sendBtn').disabled = false;
      document.getElementById('messageInput').focus();
    }

    document.getElementById('usernameInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') joinChat();
    });

    // ── SEND ──
    function sendMessage() {
      const input = document.getElementById('messageInput');
      const text = input.value.trim();
      if (!text) return;
      socket.emit('chatMessage', text);
      input.value = '';
      input.focus();
    }

    document.getElementById('messageInput').addEventListener('keydown', e => {
      if (e.key === 'Enter') sendMessage();
    });

    // ── RECEIVE message ──
    socket.on('chatMessage', ({ username, text, time }) => {
      const isMe = username === myUsername;
      addMessage(username, text, time, isMe ? 'me' : 'other');
    });

    // ── SYSTEM notifications ──
    socket.on('systemMessage', ({ text }) => {
      addMessage('', text, '', 'system');
    });

    // ── USER COUNT ──
    socket.on('userCount', count => {
      document.getElementById('count').textContent = count;
    });

    // ── RENDER message ──
    function addMessage(username, text, time, type) {
      const wrap = document.getElementById('messages-wrap');
      const msg = document.createElement('div');
      msg.className = `msg ${type}`;

      if (type === 'system') {
        msg.innerHTML = `<div class="bubble">${text}</div>`;
      } else {
        const label = type === 'me' ? 'tu' : username;
        msg.innerHTML = `
          <div class="author">${label}</div>
          <div class="bubble">${escHtml(text)}</div>
          <div class="time">${time}</div>
        `;
      }

      wrap.appendChild(msg);
      wrap.scrollTop = wrap.scrollHeight;
    }

    function escHtml(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }
  </script>
</body>
</html>
